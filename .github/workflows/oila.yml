name: Build APK

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Generate project files
        run: |
          mkdir -p app/src/main/java/com/hastyar/freezetranslate
          mkdir -p app/src/main/res/xml

          cat > settings.gradle.kts <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "FreezeTranslate"
          include(":app")
          EOF

          cat > build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          EOF

          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx3g
          android.useAndroidX=true
          EOF

          cat > app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "com.hastyar.freezetranslate"
              compileSdk = 34

              defaultConfig {
                  applicationId = "com.hastyar.freezetranslate"
                  minSdk = 30
                  targetSdk = 34
                  versionCode = 3
                  versionName = "3.0"
                  ndk {
                      abiFilters += listOf("arm64-v8a")
                  }
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = "17"
              }
          }

          dependencies {
              implementation("com.google.mlkit:text-recognition:16.0.0")
              implementation("com.google.mlkit:text-recognition-japanese:16.0.0")
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET" />

              <application
                  android:allowBackup="false"
                  android:label="Freeze Translate"
                  android:theme="@android:style/Theme.Material.NoActionBar">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <service
                      android:name=".FreezeService"
                      android:exported="true"
                      android:label="Freeze Translate"
                      android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE">
                      <intent-filter>
                          <action android:name="android.accessibilityservice.AccessibilityService" />
                      </intent-filter>
                      <meta-data
                          android:name="android.accessibilityservice"
                          android:resource="@xml/accessibility_config" />
                  </service>
              </application>
          </manifest>
          EOF

          cat > app/src/main/res/xml/accessibility_config.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <accessibility-service xmlns:android="http://schemas.android.com/apk/res/android"
              android:accessibilityEventTypes="typeWindowStateChanged"
              android:accessibilityFeedbackType="feedbackGeneric"
              android:accessibilityFlags="flagRequestFilterKeyEvents"
              android:canRequestFilterKeyEvents="true"
              android:canTakeScreenshot="true"
              android:notificationTimeout="100"
              android:description="Volume Up: translate the saved region. Hold Volume Up: choose a new region. Volume Down: hide the translation." />
          EOF

          cat > app/src/main/java/com/hastyar/freezetranslate/MainActivity.kt <<'EOF'
          package com.hastyar.freezetranslate

          import android.app.Activity
          import android.content.Intent
          import android.net.Uri
          import android.os.Bundle
          import android.provider.Settings
          import android.view.View
          import android.widget.Button
          import android.widget.LinearLayout
          import android.widget.RadioButton
          import android.widget.RadioGroup
          import android.widget.ScrollView
          import android.widget.TextView
          import android.widget.Toast

          class MainActivity : Activity() {

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  val root = LinearLayout(this)
                  root.orientation = LinearLayout.VERTICAL
                  root.layoutDirection = View.LAYOUT_DIRECTION_RTL
                  root.setPadding(48, 120, 48, 48)

                  val info = TextView(this)
                  info.textSize = 16f
                  info.text = "١. «Restricted settings» چالاک بکە: دوگمەی یەکەم دابگرە، ئینجا سێ خاڵەکەی سەرەوە (⋮) و «Allow restricted settings».\n\n" +
                          "٢. دوگمەی دووەم دابگرە و لە لیستەکەدا «Freeze Translate» بکەرەوە و بیکە ON.\n\n" +
                          "٣. لە خوارەوە زمانی دەقی یاریەکە هەڵبژێرە.\n\n" +
                          "٤. بچۆ ناو یاریەکە:\n" +
                          "• Volume Up بە کورتی: لاکێشە پاشەکەوتکراوەکە دەخوێنرێتەوە، دەکرێت بە کوردی و لەسەر سەبتایتڵەکە دادەنرێت (ئینتەرنێت پێویستە).\n" +
                          "• Volume Up بۆ نیو چرکە: لاکێشەیەکی نوێ دیاری دەکەیت. یەکەم جار خۆی دەیکاتەوە.\n" +
                          "• Volume Down: وەرگێڕانەکە لادەبات.\n\n" +
                          "ئامۆژگاری: لاکێشەکە با بەشی سەبتایتڵەکە بگرێتە خۆی و کەمێک گەورەتر بێت، بۆ ئەوەی دەقە کوردییەکە جێی ببێتەوە.\n\n" +
                          "ئاگاداری: تا خزمەتگوزارییەکە ON بێت، Volume Up دەنگ زیاد ناکات، و تا وەرگێڕانەکە لەسەر شاشە بێت Volume Down دەنگ کەم ناکاتەوە."
                  root.addView(info)

                  val prefs = getSharedPreferences("settings", MODE_PRIVATE)
                  val rg = RadioGroup(this)
                  val rb1 = RadioButton(this)
                  rb1.id = View.generateViewId()
                  rb1.text = "English / لاتینی"
                  val rb2 = RadioButton(this)
                  rb2.id = View.generateViewId()
                  rb2.text = "日本語 / ژاپۆنی"
                  rg.addView(rb1)
                  rg.addView(rb2)
                  rg.check(if (prefs.getString("ocr", "latin") == "ja") rb2.id else rb1.id)
                  rg.setOnCheckedChangeListener { _, checkedId ->
                      prefs.edit().putString("ocr", if (checkedId == rb2.id) "ja" else "latin").apply()
                  }
                  root.addView(rg)

                  addButton(root, "١. Restricted settings (زانیاری بەرنامەکە)") {
                      startActivity(
                          Intent(
                              Settings.ACTION_APPLICATION_DETAILS_SETTINGS,
                              Uri.parse("package:$packageName")
                          )
                      )
                  }
                  addButton(root, "٢. کردنەوەی ڕێکخستنی Accessibility") {
                      startActivity(Intent(Settings.ACTION_ACCESSIBILITY_SETTINGS))
                  }
                  addButton(root, "سڕینەوەی لاکێشە پاشەکەوتکراوەکان") {
                      getSharedPreferences("region", MODE_PRIVATE).edit().clear().apply()
                      Toast.makeText(this, "سڕایەوە", Toast.LENGTH_SHORT).show()
                  }

                  val sv = ScrollView(this)
                  sv.addView(root)
                  setContentView(sv)
              }

              private fun addButton(root: LinearLayout, text: String, onClick: () -> Unit) {
                  val b = Button(this)
                  b.text = text
                  b.setOnClickListener { onClick() }
                  root.addView(b)
              }
          }
          EOF

          cat > app/src/main/java/com/hastyar/freezetranslate/FreezeService.kt <<'EOF'
          package com.hastyar.freezetranslate

          import android.accessibilityservice.AccessibilityService
          import android.content.Context
          import android.graphics.Bitmap
          import android.graphics.Canvas
          import android.graphics.Color
          import android.graphics.Paint
          import android.graphics.PixelFormat
          import android.graphics.Rect
          import android.os.Handler
          import android.os.Looper
          import android.util.DisplayMetrics
          import android.util.TypedValue
          import android.view.Display
          import android.view.Gravity
          import android.view.KeyEvent
          import android.view.MotionEvent
          import android.view.View
          import android.view.WindowManager
          import android.view.accessibility.AccessibilityEvent
          import android.widget.TextView
          import android.widget.Toast
          import com.google.mlkit.vision.common.InputImage
          import com.google.mlkit.vision.text.TextRecognition
          import com.google.mlkit.vision.text.TextRecognizer
          import com.google.mlkit.vision.text.japanese.JapaneseTextRecognizerOptions
          import com.google.mlkit.vision.text.latin.TextRecognizerOptions
          import org.json.JSONArray
          import java.net.HttpURLConnection
          import java.net.URL
          import java.net.URLEncoder
          import java.util.concurrent.Executors

          class FreezeService : AccessibilityService() {

              private lateinit var wm: WindowManager
              private val handler = Handler(Looper.getMainLooper())
              private val net = Executors.newSingleThreadExecutor()

              private var overlay: View? = null
              private var selector: SelectionView? = null
              private var longFired = false
              private var swallowDown = false
              private var busy = false
              private var jobId = 0
              private var lastSrc = ""
              private var lastDst = ""
              private var recognizer: TextRecognizer? = null
              private var recognizerKey: String? = null

              private val longRun = Runnable {
                  longFired = true
                  startSelection()
              }

              private val busyReset = Runnable {
                  busy = false
                  jobId++
                  removeOverlay()
              }

              override fun onServiceConnected() {
                  super.onServiceConnected()
                  wm = getSystemService(Context.WINDOW_SERVICE) as WindowManager
              }

              override fun onAccessibilityEvent(event: AccessibilityEvent?) {}

              override fun onInterrupt() {}

              override fun onKeyEvent(event: KeyEvent): Boolean {
                  val code = event.keyCode

                  if (code == KeyEvent.KEYCODE_VOLUME_DOWN) {
                      if (event.action == KeyEvent.ACTION_DOWN) {
                          if (selector != null) {
                              onSelected(null)
                              swallowDown = true
                              return true
                          }
                          if (overlay != null || busy) {
                              jobId++
                              busy = false
                              handler.removeCallbacks(busyReset)
                              removeOverlay()
                              swallowDown = true
                              return true
                          }
                          return swallowDown
                      } else {
                          if (swallowDown) {
                              swallowDown = false
                              return true
                          }
                          return false
                      }
                  }

                  if (code != KeyEvent.KEYCODE_VOLUME_UP) return false
                  if (selector != null) return true

                  when (event.action) {
                      KeyEvent.ACTION_DOWN -> {
                          if (event.repeatCount == 0) {
                              longFired = false
                              handler.postDelayed(longRun, 600)
                          }
                      }
                      KeyEvent.ACTION_UP -> {
                          handler.removeCallbacks(longRun)
                          if (!longFired) translateNow()
                      }
                  }
                  return true
              }

              // ---------- saved region ----------

              private fun dp(v: Int): Int = (v * resources.displayMetrics.density).toInt()

              private fun realSize(): Pair<Int, Int> {
                  val dm = DisplayMetrics()
                  @Suppress("DEPRECATION")
                  wm.defaultDisplay.getRealMetrics(dm)
                  return Pair(dm.widthPixels, dm.heightPixels)
              }

              private fun orientationKey(): String {
                  val (sw, sh) = realSize()
                  return if (sw > sh) "land" else "port"
              }

              private fun saveRect(r: Rect) {
                  val k = orientationKey()
                  getSharedPreferences("region", MODE_PRIVATE).edit()
                      .putInt(k + "_l", r.left)
                      .putInt(k + "_t", r.top)
                      .putInt(k + "_r", r.right)
                      .putInt(k + "_b", r.bottom)
                      .apply()
              }

              private fun loadRect(): Rect? {
                  val k = orientationKey()
                  val p = getSharedPreferences("region", MODE_PRIVATE)
                  if (!p.contains(k + "_l")) return null
                  return Rect(
                      p.getInt(k + "_l", 0),
                      p.getInt(k + "_t", 0),
                      p.getInt(k + "_r", 0),
                      p.getInt(k + "_b", 0)
                  )
              }

              // ---------- region selection ----------

              private fun startSelection() {
                  if (selector != null) return
                  jobId++
                  busy = false
                  handler.removeCallbacks(busyReset)
                  removeOverlay()
                  val sv = SelectionView(this) { rect -> onSelected(rect) }
                  val lp = WindowManager.LayoutParams(
                      WindowManager.LayoutParams.MATCH_PARENT,
                      WindowManager.LayoutParams.MATCH_PARENT,
                      WindowManager.LayoutParams.TYPE_ACCESSIBILITY_OVERLAY,
                      WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE or
                              WindowManager.LayoutParams.FLAG_LAYOUT_IN_SCREEN or
                              WindowManager.LayoutParams.FLAG_LAYOUT_NO_LIMITS,
                      PixelFormat.TRANSLUCENT
                  )
                  lp.layoutInDisplayCutoutMode = 3
                  wm.addView(sv, lp)
                  selector = sv
              }

              private fun onSelected(rect: Rect?) {
                  selector?.let {
                      try { wm.removeView(it) } catch (e: Exception) { }
                  }
                  selector = null
                  if (rect == null || rect.width() < 24 || rect.height() < 24) return
                  saveRect(rect)
                  handler.postDelayed({ translateNow() }, 250)
              }

              // ---------- capture -> OCR -> translate -> overlay ----------

              private fun translateNow() {
                  if (busy) return
                  val rect = loadRect()
                  if (rect == null) {
                      startSelection()
                      return
                  }
                  busy = true
                  val id = ++jobId
                  handler.removeCallbacks(busyReset)
                  handler.postDelayed(busyReset, 15000)
                  removeOverlay()
                  handler.postDelayed({ if (id == jobId) capture(id, rect, 0) }, 200)
              }

              private fun fail(id: Int, msg: String) {
                  if (id != jobId) return
                  busy = false
                  handler.removeCallbacks(busyReset)
                  removeOverlay()
                  Toast.makeText(this, msg, Toast.LENGTH_SHORT).show()
              }

              private fun done(id: Int) {
                  if (id != jobId) return
                  busy = false
                  handler.removeCallbacks(busyReset)
              }

              private fun capture(id: Int, rect: Rect, attempt: Int) {
                  takeScreenshot(
                      Display.DEFAULT_DISPLAY,
                      mainExecutor,
                      object : AccessibilityService.TakeScreenshotCallback {
                          override fun onSuccess(result: AccessibilityService.ScreenshotResult) {
                              var crop: Bitmap? = null
                              try {
                                  val hb = result.hardwareBuffer
                                  val hw = Bitmap.wrapHardwareBuffer(hb, result.colorSpace)
                                  if (hw != null) {
                                      val soft = hw.copy(Bitmap.Config.ARGB_8888, false)
                                      hw.recycle()
                                      if (soft != null) {
                                          val r = Rect(rect)
                                          if (r.intersect(0, 0, soft.width, soft.height)) {
                                              crop = Bitmap.createBitmap(soft, r.left, r.top, r.width(), r.height())
                                          }
                                          soft.recycle()
                                      }
                                  }
                                  hb.close()
                              } catch (e: Exception) {
                                  crop = null
                              }
                              if (id != jobId) {
                                  crop?.recycle()
                                  return
                              }
                              if (crop == null) {
                                  fail(id, "نەتوانرا وێنە بگیرێت")
                                  return
                              }
                              showOverlay("…", rect)
                              recognize(id, crop, rect)
                          }

                          override fun onFailure(errorCode: Int) {
                              if (id != jobId) return
                              if (errorCode == AccessibilityService.ERROR_TAKE_SCREENSHOT_INTERVAL_TIME_SHORT && attempt < 3) {
                                  handler.postDelayed({ if (id == jobId) capture(id, rect, attempt + 1) }, 500)
                              } else {
                                  fail(id, "نەتوانرا شاشە بگیرێت (" + errorCode + ")")
                              }
                          }
                      }
                  )
              }

              private fun getRecognizer(): TextRecognizer {
                  val key = getSharedPreferences("settings", MODE_PRIVATE).getString("ocr", "latin") ?: "latin"
                  var rec = recognizer
                  if (rec == null || recognizerKey != key) {
                      rec?.close()
                      rec = if (key == "ja") {
                          TextRecognition.getClient(JapaneseTextRecognizerOptions.Builder().build())
                      } else {
                          TextRecognition.getClient(TextRecognizerOptions.DEFAULT_OPTIONS)
                      }
                      recognizer = rec
                      recognizerKey = key
                  }
                  return rec!!
              }

              private fun recognize(id: Int, bmp: Bitmap, rect: Rect) {
                  val rec = getRecognizer()
                  rec.process(InputImage.fromBitmap(bmp, 0))
                      .addOnSuccessListener { result ->
                          bmp.recycle()
                          if (id != jobId) return@addOnSuccessListener
                          val src = result.text.replace(Regex("\\s+"), " ").trim()
                          if (src.isEmpty()) {
                              fail(id, "دەقێک نەدۆزرایەوە")
                              return@addOnSuccessListener
                          }
                          if (src == lastSrc && lastDst.isNotEmpty()) {
                              showOverlay(lastDst, rect)
                              done(id)
                              return@addOnSuccessListener
                          }
                          translate(id, src, rect)
                      }
                      .addOnFailureListener { e ->
                          bmp.recycle()
                          fail(id, "OCR: " + (e.message ?: ""))
                      }
              }

              private fun translate(id: Int, src: String, rect: Rect) {
                  net.execute {
                      val out = try { googleTranslate(src) } catch (e: Exception) { null }
                      handler.post {
                          if (id == jobId) {
                              if (out == null) {
                                  fail(id, "وەرگێڕان سەرکەوتوو نەبوو (ئینتەرنێت؟)")
                              } else {
                                  lastSrc = src
                                  lastDst = out
                                  showOverlay(out, rect)
                                  done(id)
                              }
                          }
                      }
                  }
              }

              private fun googleTranslate(text: String): String? {
                  val url = URL(
                      "https://translate.googleapis.com/translate_a/single?client=gtx&sl=auto&tl=ckb&dt=t&q=" +
                              URLEncoder.encode(text, "UTF-8")
                  )
                  val c = url.openConnection() as HttpURLConnection
                  c.connectTimeout = 6000
                  c.readTimeout = 8000
                  c.setRequestProperty("User-Agent", "Mozilla/5.0")
                  try {
                      if (c.responseCode != 200) return null
                      val body = c.inputStream.bufferedReader(Charsets.UTF_8).use { it.readText() }
                      val arr = JSONArray(body).getJSONArray(0)
                      val sb = StringBuilder()
                      for (i in 0 until arr.length()) {
                          val part = arr.optJSONArray(i) ?: continue
                          sb.append(part.optString(0, ""))
                      }
                      val res = sb.toString().trim()
                      return if (res.isEmpty()) null else res
                  } finally {
                      c.disconnect()
                  }
              }

              // ---------- overlay ----------

              private fun showOverlay(text: String, rect: Rect) {
                  removeOverlay()
                  val tv = TextView(this)
                  tv.text = text
                  tv.setTextColor(Color.WHITE)
                  tv.gravity = Gravity.CENTER
                  tv.layoutDirection = View.LAYOUT_DIRECTION_RTL
                  tv.textDirection = View.TEXT_DIRECTION_RTL
                  tv.setBackgroundColor(0xE6101010.toInt())
                  tv.setPadding(dp(8), dp(4), dp(8), dp(4))
                  tv.setAutoSizeTextTypeUniformWithConfiguration(10, 30, 1, TypedValue.COMPLEX_UNIT_SP)
                  val lp = WindowManager.LayoutParams(
                      rect.width(), rect.height(),
                      WindowManager.LayoutParams.TYPE_ACCESSIBILITY_OVERLAY,
                      WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE or
                              WindowManager.LayoutParams.FLAG_NOT_TOUCHABLE or
                              WindowManager.LayoutParams.FLAG_LAYOUT_IN_SCREEN or
                              WindowManager.LayoutParams.FLAG_LAYOUT_NO_LIMITS,
                      PixelFormat.TRANSLUCENT
                  )
                  lp.gravity = Gravity.TOP or Gravity.START
                  lp.x = rect.left
                  lp.y = rect.top
                  lp.layoutInDisplayCutoutMode = 3
                  wm.addView(tv, lp)
                  overlay = tv
              }

              private fun removeOverlay() {
                  overlay?.let {
                      try { wm.removeView(it) } catch (e: Exception) { }
                  }
                  overlay = null
              }

              override fun onDestroy() {
                  handler.removeCallbacksAndMessages(null)
                  jobId++
                  removeOverlay()
                  selector?.let { try { wm.removeView(it) } catch (e: Exception) { } }
                  selector = null
                  recognizer?.close()
                  recognizer = null
                  net.shutdown()
                  super.onDestroy()
              }
          }

          class SelectionView(ctx: Context, private val onDone: (Rect?) -> Unit) : View(ctx) {
              private val fill = Paint().apply { color = 0x2200FFFF }
              private val border = Paint().apply {
                  color = Color.CYAN
                  style = Paint.Style.STROKE
                  strokeWidth = 5f
              }
              private val hint = Paint().apply {
                  color = Color.WHITE
                  textSize = 46f
                  textAlign = Paint.Align.CENTER
                  isAntiAlias = true
              }
              private var x0 = 0f
              private var y0 = 0f
              private var x1 = 0f
              private var y1 = 0f
              private var has = false

              init {
                  setBackgroundColor(0x55000000)
              }

              override fun onDraw(c: Canvas) {
                  super.onDraw(c)
                  c.drawText("شوێنی سەبتایتڵەکە دیاری بکە (کلیکی سادە = هەڵوەشاندنەوە)", width / 2f, 140f, hint)
                  if (has) {
                      val l = minOf(x0, x1)
                      val t = minOf(y0, y1)
                      val r = maxOf(x0, x1)
                      val b = maxOf(y0, y1)
                      c.drawRect(l, t, r, b, fill)
                      c.drawRect(l, t, r, b, border)
                  }
              }

              override fun onTouchEvent(e: MotionEvent): Boolean {
                  when (e.action) {
                      MotionEvent.ACTION_DOWN -> {
                          x0 = e.x; y0 = e.y; x1 = e.x; y1 = e.y
                          has = true
                          invalidate()
                      }
                      MotionEvent.ACTION_MOVE -> {
                          x1 = e.x; y1 = e.y
                          invalidate()
                      }
                      MotionEvent.ACTION_UP -> {
                          x1 = e.x; y1 = e.y
                          val loc = IntArray(2)
                          getLocationOnScreen(loc)
                          val r = Rect(
                              minOf(x0, x1).toInt() + loc[0],
                              minOf(y0, y1).toInt() + loc[1],
                              maxOf(x0, x1).toInt() + loc[0],
                              maxOf(y0, y1).toInt() + loc[1]
                          )
                          onDone(r)
                      }
                      MotionEvent.ACTION_CANCEL -> onDone(null)
                  }
                  return true
              }
          }
          EOF

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: FreezeTranslate-APK
          path: app/build/outputs/apk/debug/app-debug.apk
